name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      weaviate:
        image: cr.weaviate.io/semitechnologies/weaviate:1.34.0
        ports:
          - 8080:8080
          - 50051:50051
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          DEFAULT_VECTORIZER_MODULE: "none"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          CLUSTER_HOSTNAME: node1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('app/settings.py') }}
      - name: Wait for Weaviate
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v1/.well-known/ready && exit 0
            sleep 2
          done
          exit 1
      - run: uv run pytest -m integration
        env:
          WEAVIATE_URL: http://localhost:8080
