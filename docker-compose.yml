version: '3.8'

services:
  weaviate:
    image: semitechnologies/weaviate:1.23.7
    container_name: astros-weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-transformers'
      ENABLE_MODULES: 'text2vec-transformers'
      TRANSFORMERS_INFERENCE_API: 'http://t2v-transformers:8080'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - astros-network

  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-paraphrase-multilingual-mpnet-base-v2
    container_name: astros-transformers
    restart: unless-stopped
    environment:
      ENABLE_CUDA: '0'
    networks:
      - astros-network

  api:
    build: .
    container_name: astros-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WEAVIATE_URL=http://weaviate:8080
      - WEAVIATE_GRPC_HOST=weaviate
      - WEAVIATE_GRPC_PORT=50051
    depends_on:
      - weaviate
      - t2v-transformers
    volumes:
      - ./movies.csv:/app/movies.csv
    networks:
      - astros-network

volumes:
  weaviate_data:

networks:
  astros-network:
    driver: bridge